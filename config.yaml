# Pipeline Behavior
max_experiences: 3
max_bullets_per_experience: 4
minimum_similarity: 0.25
mmr_lambda: 0.7

# Scoring Weights (must sum to 1.0)
weights:
  tfidf: 0.35
  embedding: 0.30
  skill_overlap: 0.20
  importance: 0.10
  company_boost: 0.05

# Embedding Model (loaded via fastembed ONNX)
embedding_model: "BAAI/bge-small-en-v1.5"

# Rewriter Settings (Multi-Provider Stack with Priority Sorting)
rewriter:
  enabled: true
  ollama_model: "qwen2.5:1.5b"
  ollama_timeout: 30

  # API Rate Limiting & Anti-DDoS Safety Settings
  rate_limit:
    min_request_interval: 0.5    # Minimum seconds between requests to the same cloud API
    max_retries: 1               # Transient error retries with exponential backoff before failover
    backoff_base: 1.0            # Base seconds for exponential backoff + random jitter
    cooldown_seconds: 60.0       # Cooldown window when rate limited (429/503) or circuit broken
    circuit_breaker_threshold: 2 # Consecutive failures before temporarily tripping a provider
    ollama_request_interval: 0.25 # Minimum seconds between sequential local Ollama requests

  # Stacked Cloud API Providers (Tried in order of priority: 1st OpenRouter -> 2nd Gemini -> 3rd Cerebras -> 4th Groq)
  # Lower priority number = higher priority. You can also define custom providers or set CUSTOM_API_KEY in .env.
  providers:
    - name: "openrouter"
      api_url: "https://openrouter.ai/api/v1"
      api_model: "meta-llama/llama-3.3-70b-instruct:free"
      api_key_env: "OPENROUTER_API_KEY"
      timeout_seconds: 10
      max_tokens: 100
      temperature: 0.3
      priority: 1
      enabled: true

    - name: "gemini"
      api_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      api_model: "gemini-3.8-flash"

      api_key_env: "GEMINI_API_KEY"
      timeout_seconds: 10
      max_tokens: 100
      temperature: 0.3
      priority: 2
      enabled: true

    - name: "cerebras"
      api_url: "https://api.cerebras.ai/v1"
      api_model: "llama3.1-8b"
      api_key_env: "CEREBRAS_API_KEY"
      timeout_seconds: 8
      max_tokens: 100
      temperature: 0.3
      priority: 3
      enabled: true

    - name: "groq"
      api_url: "https://api.groq.com/openai/v1"
      api_model: "llama-3.3-70b-versatile"
      api_key_env: "GROQ_API_KEY"
      timeout_seconds: 5
      max_tokens: 100
      temperature: 0.3
      priority: 4
      enabled: true

# Rewriter Prompt Constraints
rewriter_prompt: |
  CRITICAL: The original bullet point is the strict SOURCE OF TRUTH. You must NEVER add new facts, invent metrics, extrapolate outcomes, or hallucinate experiences not present in the original bullet.
  Only reword the original sentence to better highlight relevant technical context or match job description keywords, preserving all original facts, metrics, tools, and meaning exactly.
  If no rewording is needed or if rewording risks hallucination, return the original bullet unmodified.
  Return exactly one sentence.

# Output Settings
output:
  compile_pdf: true
  open_pdf: true
  show_ats_report: true
  show_diff: false
  show_manifest: false
  copy_to_clipboard: false
  debug: false

