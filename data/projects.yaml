projects:
  - id: "distributed_kvstore"
    title: "Distributed Key-Value Store"
    tech_stack: ["Go", "Raft Consensus", "LevelDB", "gRPC", "Docker"]
    dates: "2023 -- Present"
    bullets:
      - "Implemented Raft distributed consensus protocol from scratch in Go, achieving linearizable read/write operations across a 5-node cluster with sub-10ms commit latency."
      - "Engineered a log-structured merge tree (LSM) storage backend backed by LevelDB with write-ahead logging, sustaining 80K ops/sec on commodity hardware."
      - "Packaged multi-node cluster test harness using Docker Compose, verifying automated leader election under simulated network partition scenarios."

