      - "Built an asynchronous event ingestion engine in Rust processing 500K events/sec with memory-safe concurrency and sub-5ms processing delay."
      - "Designed backpressure-aware Kafka consumer groups with Redis sliding-window deduplication, eliminating duplicate message delivery under high burst loads."

  - id: "design_system"
